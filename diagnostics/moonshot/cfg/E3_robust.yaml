# E3 — FULL PACKAGE: pose budget + offset penalty + robust chamfer + joint final stage.
# Adds interventions (4) and (5): a Geman-McClure robust kernel with graduated
# non-convexity (robust_scale annealed large->small) plus trimming, because the targets
# are CT scans of ethanol-preserved ants and contain debris/holes that plain least-squares
# chamfer chases. The final stage uses scheme 'all' so pose is NEVER frozen -- offsets and
# pose refine jointly, which is the direct fix for the 83%-of-iterations-are-deform-only
# finding.
stages:
  A_init:
    scheme: 'init_rot_lock'
    nits: 150
    lr: 0.05
    n_sample: 6000
    robust_kernel: 'gm'
    robust_scale: 0.30
    robust_scale_end: 0.15
    loss_weights: {w_chamfer: 1.0, w_edge: 0.0, w_normal: 0.0, w_laplacian: 0.0}
  B_pose_coarse:
    scheme: 'default'
    nits: 800
    lr: 0.02
    n_sample: 6000
    robust_kernel: 'gm'
    robust_scale: 0.15
    robust_scale_end: 0.05
    trim_frac: 0.02
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.02, w_laplacian: 0.01, w_normal_align: 0.05}
    custom_lrs: {joint_rot: 0.02}
  C_pose_fine:
    scheme: 'pose'
    nits: 600
    lr: 0.008
    n_sample: 8000
    robust_kernel: 'gm'
    robust_scale: 0.05
    robust_scale_end: 0.02
    trim_frac: 0.03
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.02, w_laplacian: 0.01, w_normal_align: 0.05}
    custom_lrs: {joint_rot: 0.008}
  D_joint_coarse:
    scheme: 'all'
    nits: 500
    lr: 0.002
    n_sample: 8000
    robust_kernel: 'gm'
    robust_scale: 0.03
    trim_frac: 0.03
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.005, w_laplacian: 0.01, w_offset: 5.0}
    custom_lrs: {joint_rot: 0.004, deform_verts: 0.002}
  E_joint_fine:
    scheme: 'all'
    nits: 350
    lr: 0.0008
    n_sample: 8000
    robust_kernel: 'gm'
    robust_scale: 0.02
    trim_frac: 0.03
    loss_weights: {w_chamfer: 0.5, w_edge: 0.1, w_normal: 0.002, w_laplacian: 0.001, w_offset: 2.0}
    custom_lrs: {joint_rot: 0.001, deform_verts: 0.0008}
args:
  results_dir: diagnostics/moonshot/runs/E3_robust

# E4 — FULL PACKAGE + THE TWO DEAD PRIORS.
# E3 plus:
#   w_beta_prior : activates the Mahalanobis shape prior built from the model's own 13x13
#                  'shape_cov'. SMAL3DFitter computes betas_prec (Cholesky of the inverse
#                  covariance) at trainer.py:83 and NOTHING in the repo ever reads it --
#                  verified by grep. Betas are currently fit with no prior whatsoever.
#   w_sym        : ties each '*_r' joint's log_beta_scales/betas_trans to its '*_l' twin
#                  (24 pairs; the 7 midline joints b_t/b_a_1..5/b_h are excluded).
#                  Joint ROTATIONS stay free -- an ant is symmetric in shape, not in pose.
# Both are pose/shape-stage terms, i.e. they act at or before the pose-truth checkpoint.
stages:
  A_init:
    scheme: 'init_rot_lock'
    nits: 150
    lr: 0.05
    n_sample: 6000
    robust_kernel: 'gm'
    robust_scale: 0.30
    robust_scale_end: 0.15
    loss_weights: {w_chamfer: 1.0, w_edge: 0.0, w_normal: 0.0, w_laplacian: 0.0, w_sym: 0.5}
  B_pose_coarse:
    scheme: 'default'
    nits: 800
    lr: 0.02
    n_sample: 6000
    robust_kernel: 'gm'
    robust_scale: 0.15
    robust_scale_end: 0.05
    trim_frac: 0.02
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.02, w_laplacian: 0.01,
                   w_normal_align: 0.05, w_sym: 0.5, w_beta_prior: 0.002}
    custom_lrs: {joint_rot: 0.02}
  C_pose_fine:
    scheme: 'pose'
    nits: 600
    lr: 0.008
    n_sample: 8000
    robust_kernel: 'gm'
    robust_scale: 0.05
    robust_scale_end: 0.02
    trim_frac: 0.03
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.02, w_laplacian: 0.01,
                   w_normal_align: 0.05, w_sym: 0.5, w_beta_prior: 0.002}
    custom_lrs: {joint_rot: 0.008}
  D_joint_coarse:
    scheme: 'all'
    nits: 500
    lr: 0.002
    n_sample: 8000
    robust_kernel: 'gm'
    robust_scale: 0.03
    trim_frac: 0.03
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.005, w_laplacian: 0.01,
                   w_offset: 5.0, w_sym: 0.5, w_beta_prior: 0.002}
    custom_lrs: {joint_rot: 0.004, deform_verts: 0.002}
  E_joint_fine:
    scheme: 'all'
    nits: 350
    lr: 0.0008
    n_sample: 8000
    robust_kernel: 'gm'
    robust_scale: 0.02
    trim_frac: 0.03
    loss_weights: {w_chamfer: 0.5, w_edge: 0.1, w_normal: 0.002, w_laplacian: 0.001,
                   w_offset: 2.0, w_sym: 0.5, w_beta_prior: 0.002}
    custom_lrs: {joint_rot: 0.001, deform_verts: 0.0008}
args:
  results_dir: diagnostics/moonshot/runs/E4_priors

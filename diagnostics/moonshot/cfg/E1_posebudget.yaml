# E1 — POSE BUDGET ONLY.
# Isolates intervention (1): give pose enough learning rate and iterations to actually
# move, and stop freezing it. Loss terms are kept as close to baseline as the moonshot
# trainer allows (l2 chamfer, no offset penalty) so any change is attributable to pose.
# NOTE: w_edge here drives the REST-edge loss (deviation from template edge lengths),
# not pytorch3d's shrinkage edge loss, so its scale differs from baseline by construction.
stages:
  A_init:
    scheme: 'init_rot_lock'
    nits: 150
    lr: 0.05
    n_sample: 6000
    loss_weights: {w_chamfer: 1.0, w_edge: 0.0, w_normal: 0.0, w_laplacian: 0.0}
  B_pose_coarse:
    scheme: 'default'
    nits: 800
    lr: 0.02
    n_sample: 6000
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.02, w_laplacian: 0.01}
    custom_lrs: {joint_rot: 0.02}
  C_pose_fine:
    scheme: 'pose'
    nits: 600
    lr: 0.008
    n_sample: 8000
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.02, w_laplacian: 0.01}
    custom_lrs: {joint_rot: 0.008}
  D_deform_coarse:
    scheme: 'deform'
    nits: 500
    lr: 0.002
    n_sample: 8000
    loss_weights: {w_chamfer: 1.0, w_edge: 0.2, w_normal: 0.005, w_laplacian: 0.01}
  E_deform_fine:
    scheme: 'deform'
    nits: 350
    lr: 0.0005
    n_sample: 8000
    loss_weights: {w_chamfer: 0.5, w_edge: 0.1, w_normal: 0.002, w_laplacian: 0.001}
args:
  results_dir: diagnostics/moonshot/runs/E1_posebudget

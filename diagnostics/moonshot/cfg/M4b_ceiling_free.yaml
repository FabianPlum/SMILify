stages:
  S0_init:
    scheme: init_rot_lock
    nits: 200
    lr: 0.05
    n_sample: 8000
    edge_mode: rest
    lr_decay: false
    loss_weights:
      w_chamfer: 1.0
      w_edge: 0.0
      w_normal: 0.0
      w_laplacian: 0.0
  S1_shape:
    scheme: shape
    nits: 800
    lr: 0.02
    n_sample: 8000
    edge_mode: rest
    lr_decay: true
    loss_weights:
      w_chamfer: 1.0
      w_edge: 0.05
      w_normal: 0.01
      w_laplacian: 0.005
  S2_pose:
    scheme: default_with_betas_trans
    nits: 1500
    lr: 0.015
    n_sample: 10000
    edge_mode: rest
    lr_decay: true
    loss_weights:
      w_chamfer: 1.0
      w_edge: 0.05
      w_normal: 0.01
      w_laplacian: 0.005
    custom_lrs:
      joint_rot: 0.01
  S3_pose_fine:
    scheme: pose
    nits: 1500
    lr: 0.005
    n_sample: 12000
    edge_mode: rest
    lr_decay: true
    loss_weights:
      w_chamfer: 1.0
      w_edge: 0.05
      w_normal: 0.01
      w_laplacian: 0.005
    custom_lrs:
      joint_rot: 0.003
args:
  results_dir: diagnostics/moonshot/runs/M4b_ceiling_free

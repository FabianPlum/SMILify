# CLAIX build of the repo's environment.yml, validated 2026-11-04 (imports, ViT-L weights, a 4x H100
# smoke run, and a byte-identical dataset decode against the workstation). Differences from environment.yml:
# - core stack pinned to its channels: Miniforge's flexible priority otherwise installs conda-forge's
#   torch 2.3.1, whose C++ ABI does not match the pytorch3d channel's 0.7.8 build (undefined c10 symbol)
# - mkl<2024.1: conda-forge mkl>=2024.1 breaks pytorch-channel torch 2.3.1 (iJIT_NotifyEvent)
# - pip packages pinned to the local reference env (unpinned pip gave numpy 2.2 and opencv 5.0).
#   numpy 1.26.4 is what the reference env imports (its `conda list` also shows a stale pip 1.25.2).
# Build:  CONDA_OVERRIDE_CUDA=11.8 mamba env create -f hpc_files/claix/environment_claix.yml
name: pytorch3d
channels:
  - pytorch
  - nvidia
  - pytorch3d
  - conda-forge
dependencies:
  - python=3.10
  - pytorch::pytorch=2.3.1=*cuda11.8*
  - pytorch::pytorch-cuda=11.8
  - pytorch::torchvision=0.18.1
  - pytorch3d::pytorch3d=0.7.8
  - mkl<2024.1
  - scipy
  - h5py
  - pandas
  - pillow
  - imageio
  - scikit-image
  - trimesh
  - tqdm
  - psutil
  - pyyaml
  - pytest
  - pip
  - pip:
    - numpy==1.26.4
    - matplotlib==3.9.1
    - timm==1.0.20
    - huggingface-hub==0.35.0
    - safetensors==0.6.2
    - opencv-python==4.10.0.84
    - nibabel==5.2.1
    - pycocotools==2.0.8
    - toml==0.10.2
